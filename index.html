<html lang="en">

    <meta charset="UTF-8" />

    <title>DIT Data Cleaning &amp; Validation Engine</title>
    <script>
      // Vite HMR WebSocket Shim for Sandbox Environments
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        window.WebSocket = function(url, protocols) {
          var isViteHmr = false;
          if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
            isViteHmr = true;
          }
          if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1)) {
            isViteHmr = true;
          }

          if (isViteHmr) {
            var listeners = {};
            var fakeSocket = {
              readyState: 1, // 1 = OPEN
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              url: url,
              protocol: 'vite-hmr',
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              addEventListener: function(type, listener) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(listener);
                if (type === 'open') {
                  setTimeout(function() {
                    try { listener({ type: 'open' }); } catch(e) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, listener) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                }
              },
              dispatchEvent: function(event) {
                var type = event.type;
                if (listeners[type]) {
                  listeners[type].forEach(function(l) { try { l(event); } catch(e) {} });
                }
                return true;
              },
              send: function() {},
              close: function() {
                fakeSocket.readyState = 3;
              }
            };
            return fakeSocket;
          }

          return new NativeWebSocket(url, protocols);
        };

        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        // Suppress any stray unhandled rejections
        window.addEventListener('unhandledrejection', function(event) {
          var msg = event.reason && (event.reason.message || event.reason.stack || String(event.reason));
          if (msg && (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport'))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          if (msg.includes('WebSocket') || file.includes('@vite/client')) {
            event.preventDefault();
          }
        });
      })();
    </script>
